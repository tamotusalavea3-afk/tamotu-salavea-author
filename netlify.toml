[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/marks-of-samoa-of-war-and-darkness.html"
  to = "/marks-of-samoa-of-war-darkness.html"
  status = 301
